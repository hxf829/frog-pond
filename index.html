<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>青蛙池塘 · Frog Pond</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#0d1b1e">
</head>
<body>

<!-- ===== icon sprite ===== -->
<svg id="sprite" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <symbol id="i-frog" viewBox="0 0 48 48">
    <ellipse cx="24" cy="31" rx="18" ry="14" fill="#4cc45a"/>
    <circle cx="15" cy="15" r="8" fill="#4cc45a"/><circle cx="33" cy="15" r="8" fill="#4cc45a"/>
    <circle cx="15" cy="15" r="4.2" fill="#fff"/><circle cx="33" cy="15" r="4.2" fill="#fff"/>
    <circle cx="16" cy="16" r="2.1" fill="#12181a"/><circle cx="34" cy="16" r="2.1" fill="#12181a"/>
    <path d="M16 31a8 8 0 0 0 16 0" stroke="#2f8f3d" stroke-width="3" fill="none" stroke-linecap="round"/>
  </symbol>

  <!-- hop：一个跳到前一格的弧线 -->
  <symbol id="i-hop" viewBox="0 0 48 48" fill="none">
    <ellipse cx="10" cy="40" rx="8" ry="3.4" fill="#4cc45a" opacity=".55"/>
    <ellipse cx="38" cy="40" rx="8" ry="3.4" fill="#4cc45a"/>
    <path d="M10 34C10 12 38 12 38 34" stroke="currentColor" stroke-width="4.5"
          stroke-linecap="round" stroke-dasharray="5 5" opacity=".8"/>
    <path d="M34 27 38 36l-9-3Z" fill="currentColor"/>
  </symbol>

  <!-- chirp：声波 -->
  <symbol id="i-chirp" viewBox="0 0 48 48" fill="none">
    <path d="M13 17h6l9-8v30l-9-8h-6Z" fill="currentColor"/>
    <path d="M34 17a10 10 0 0 1 0 14" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 11a18 18 0 0 1 0 26" stroke="currentColor" stroke-width="4"
          stroke-linecap="round" opacity=".6"/>
  </symbol>

  <!-- eat：张嘴吃掉 -->
  <symbol id="i-eat" viewBox="0 0 48 48" fill="none">
    <path d="M6 24c0-8 8-14 18-14s18 6 18 14c0 3-2 5-5 5H11c-3 0-5-2-5-5Z"
          fill="currentColor" opacity=".95"/>
    <path d="M9 27h30" stroke="#0d1b1e" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="32" cy="18" r="2.6" fill="#0d1b1e"/>
    <path d="M18 34v6M26 34v6M34 34v6" stroke="currentColor" stroke-width="3"
          stroke-linecap="round" opacity=".55"/>
  </symbol>

  <!-- left：逆时针箭头 -->
  <symbol id="i-left" viewBox="0 0 48 48" fill="none">
    <path d="M33 39a15 15 0 1 0 0-30H15" stroke="currentColor" stroke-width="6"
          stroke-linecap="round"/>
    <path d="M9 9 21 4v10Z" fill="currentColor"/>
    <path d="M9 9 21 14v-10Z" fill="currentColor"/>
  </symbol>

  <!-- right：顺时针箭头 -->
  <symbol id="i-right" viewBox="0 0 48 48" fill="none">
    <path d="M15 39a15 15 0 1 1 0-30h18" stroke="currentColor" stroke-width="6"
          stroke-linecap="round"/>
    <path d="M39 9 27 4v10Z" fill="currentColor"/>
    <path d="M39 9 27 14v-10Z" fill="currentColor"/>
  </symbol>

  <!-- spin：转身 180° -->
  <symbol id="i-spin" viewBox="0 0 48 48" fill="none">
    <path d="M24 8a16 16 0 0 1 13.9 8" stroke="currentColor" stroke-width="5.5"
          stroke-linecap="round"/>
    <path d="M24 40a16 16 0 0 1-13.9-8" stroke="currentColor" stroke-width="5.5"
          stroke-linecap="round"/>
    <path d="M42 8v10H32Z" fill="currentColor"/>
    <path d="M6 40V30h10Z" fill="currentColor"/>
  </symbol>

  <!-- hatch：蛋里孵出小青蛙 -->
  <symbol id="i-hatch" viewBox="0 0 48 48" fill="none">
    <path d="M24 6c9 0 15 9 15 18a15 15 0 0 1-30 0C9 15 15 6 24 6Z" fill="currentColor" opacity=".3"/>
    <path d="M24 6c9 0 15 9 15 18a15 15 0 0 1-30 0C9 15 15 6 24 6Z"
          stroke="currentColor" stroke-width="4"/>
    <path d="M15 26c4-3 7-2 9 1 2-3 5-4 9-1" stroke="currentColor" stroke-width="3.6"
          stroke-linecap="round" fill="none"/>
    <circle cx="19" cy="20" r="2.4" fill="currentColor"/>
    <circle cx="29" cy="20" r="2.4" fill="currentColor"/>
    <path d="M10 40h28" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity=".5"/>
  </symbol>

  <!-- if：菱形分叉 -->
  <symbol id="i-if" viewBox="0 0 48 48" fill="none">
    <path d="M24 4 44 20 24 36 4 20Z" fill="currentColor" opacity=".28"/>
    <path d="M24 4 44 20 24 36 4 20Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="24" cy="20" r="3.4" fill="currentColor"/>
  </symbol>

  <!-- repeat：回路 -->
  <symbol id="i-repeat" viewBox="0 0 48 48" fill="none">
    <path d="M38 24a14 14 0 1 1-5.2-10.9" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
    <path d="M33 5v10H23Z" fill="currentColor"/>
  </symbol>

  <!-- 条件 -->
  <symbol id="i-cond-bug" viewBox="0 0 48 48">
    <circle cx="15" cy="29" r="10" fill="currentColor"/>
    <path d="M15 19v20" stroke="#0d1b1e" stroke-width="2.6"/>
    <circle cx="11" cy="26" r="2" fill="#0d1b1e"/><circle cx="19" cy="26" r="2" fill="#0d1b1e"/>
    <circle cx="11" cy="33" r="2" fill="#0d1b1e"/><circle cx="19" cy="33" r="2" fill="#0d1b1e"/>
    <path d="M9 19a6 6 0 0 1 12 0Z" fill="#0d1b1e"/>
    <path d="M33 10v26" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <path d="M27 28 33 37l6-9Z" fill="currentColor"/>
  </symbol>

  <symbol id="i-cond-empty" viewBox="0 0 48 48" fill="none">
    <path d="M10 24h12M22 18l8 6-8 6" stroke="currentColor" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="13" cy="33" r="3" fill="currentColor" opacity=".45"/>
    <path d="M34 12v22" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity=".4"/>
  </symbol>

  <symbol id="i-cond-water" viewBox="0 0 48 48" fill="none">
    <path d="M6 22c3-3 5-3 8 0s5 3 8 0 5-3 8 0 5 3 8 0" stroke="currentColor"
          stroke-width="3.4" stroke-linecap="round"/>
    <path d="M6 32c3-3 5-3 8 0s5 3 8 0 5-3 8 0 5 3 8 0" stroke="currentColor"
          stroke-width="3.4" stroke-linecap="round" opacity=".6"/>
    <path d="M33 6v20" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M28 20 33 28l5-8Z" fill="currentColor"/>
  </symbol>

  <symbol id="i-cond-abug" viewBox="0 0 48 48">
    <circle cx="24" cy="26" r="11" fill="currentColor"/>
    <path d="M24 15v22" stroke="#0d1b1e" stroke-width="2.8"/>
    <circle cx="19" cy="22" r="2" fill="#0d1b1e"/><circle cx="29" cy="22" r="2" fill="#0d1b1e"/>
    <circle cx="19" cy="30" r="2" fill="#0d1b1e"/><circle cx="29" cy="30" r="2" fill="#0d1b1e"/>
    <path d="M17 15a7 7 0 0 1 14 0Z" fill="#0d1b1e"/>
    <path d="M8 42h32" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  </symbol>

  <!-- 运行 / 单步 / 撤销 / 清空 / 重置 / 声音 / 帮助 -->
  <symbol id="i-run" viewBox="0 0 48 48"><path d="M14 7 42 24 14 41Z" fill="currentColor"/></symbol>
  <symbol id="i-step" viewBox="0 0 48 48">
    <path d="M10 9 33 24 10 39Z" fill="currentColor"/>
    <rect x="37" y="9" width="6" height="30" rx="2" fill="currentColor"/>
  </symbol>
  <symbol id="i-undo" viewBox="0 0 48 48" fill="none">
    <path d="M13 17h16a10 10 0 0 1 0 20h-6" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M3 17 15 7v20Z" fill="currentColor"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 48 48" fill="none">
    <path d="M11 15h26" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M18 15v-3a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v3" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M15 15l2.2 25a4 4 0 0 0 4 3.6h5.6a4 4 0 0 0 4-3.6L33 15" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-reset" viewBox="0 0 48 48" fill="none">
    <path d="M9 24a15 15 0 0 1 30 0" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M31 18h14l-7 10Z" fill="currentColor"/>
    <path d="M39 24a15 15 0 0 1-30 0" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" opacity=".45"/>
  </symbol>
  <symbol id="i-sound" viewBox="0 0 48 48" fill="none">
    <path d="M9 18h8l10-9v30L17 30H9Z" fill="currentColor"/>
    <path d="M32 18a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M38 13a16 16 0 0 1 0 22" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-mute" viewBox="0 0 48 48" fill="none">
    <path d="M9 18h8l10-9v30L17 30H9Z" fill="currentColor"/>
    <path d="M32 17 42 29M42 17 32 29" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-help" viewBox="0 0 48 48" fill="none">
    <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="4.5"/>
    <path d="M18 18a6 6 0 1 1 8 6v4" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="25" cy="35" r="2.6" fill="currentColor"/>
  </symbol>
  <symbol id="i-bug" viewBox="0 0 48 48">
    <circle cx="24" cy="28" r="13" fill="#e23b2c"/>
    <path d="M24 15v26" stroke="#141414" stroke-width="3.5"/>
    <circle cx="16.5" cy="24" r="2.5" fill="#141414"/><circle cx="31.5" cy="24" r="2.5" fill="#141414"/>
    <circle cx="16.5" cy="33" r="2.5" fill="#141414"/><circle cx="31.5" cy="33" r="2.5" fill="#141414"/>
    <path d="M16 15a9 9 0 0 1 16 0Z" fill="#141414"/>
  </symbol>
  <symbol id="i-score" viewBox="0 0 48 48">
    <path d="M24 5 30 17l13 2-9.5 9.3 2.2 13.7L24 36l-11.7 6 2.2-13.7L5 19l13-2Z" fill="currentColor"/>
  </symbol>
  <symbol id="i-blocks" viewBox="0 0 48 48">
    <rect x="6" y="7" width="15" height="15" rx="4" fill="currentColor" opacity=".55"/>
    <rect x="27" y="7" width="15" height="15" rx="4" fill="currentColor"/>
    <rect x="16" y="27" width="15" height="15" rx="4" fill="currentColor" opacity=".78"/>
  </symbol>
  <symbol id="i-trophy" viewBox="0 0 48 48" fill="none">
    <path d="M15 7h18v9a9 9 0 0 1-18 0Z" fill="currentColor"/>
    <path d="M15 10H9a6 6 0 0 0 6 8M33 10h6a6 6 0 0 1-6 8" stroke="currentColor" stroke-width="4"/>
    <path d="M24 25v8" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M14 42h20M17 33h14l2 9H15Z" fill="currentColor"/>
  </symbol>
  <symbol id="i-tap" viewBox="0 0 48 48" fill="none">
    <path d="M22 30V13a4 4 0 0 1 8 0v13" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M30 26v-4a4 4 0 0 1 8 0v6" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M14 20a4 4 0 0 1 8 0v10c0 8-3 12-8 12s-8-4-8-12v-4a4 4 0 0 1 8 0" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<div id="app">
  <header id="topbar">
    <div class="title">
      <svg class="ic logo"><use href="#i-frog"/></svg>
      <div>
        <h1>青蛙池塘</h1>
        <p>Frog Pond</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat" title="还剩几只甲虫"><svg class="ic"><use href="#i-bug"/></svg><b id="statBeetles">0</b></div>
      <div class="stat" title="得分"><svg class="ic"><use href="#i-score"/></svg><b id="statScore">0</b></div>
      <div class="stat" title="卡片数"><svg class="ic"><use href="#i-blocks"/></svg><b id="statMoves">0</b></div>
      <label class="modePicker"><span class="sr-only">选择玩法</span><select id="modeSelect" aria-label="选择玩法"><option value="0">自由池塘</option><option value="1">挑战 1</option><option value="2">挑战 2</option><option value="3">挑战 3</option><option value="4">挑战 4</option><option value="5">挑战 5</option></select></label>
    </div>
  </header>

  <main id="stage">
    <canvas id="pond"></canvas>
    <div id="toast"></div>
    <div id="overlay" class="hidden">
      <div class="card-box">
        <svg class="ic big" id="ovIcon"><use href="#i-trophy"/></svg>
        <h2 id="ovTitle">完成！</h2>
        <p id="ovBody"></p>
        <button id="ovBtn">继续</button>
      </div>
    </div>
  </main>

  <section id="panel">
    <div id="progWrap">
      <div id="progHead">
        <svg class="ic sm"><use href="#i-blocks"/></svg>
        <span id="progCount">0 张卡片</span>
        <div class="headBtns">
          <button id="btnUndo" class="mini" title="撤销"><svg class="ic"><use href="#i-undo"/></svg></button>
          <button id="btnClear" class="mini" title="清空"><svg class="ic"><use href="#i-trash"/></svg></button>
          <button id="btnReset" class="mini" title="重置"><svg class="ic"><use href="#i-reset"/></svg></button>
          <button id="btnSound" class="mini" title="声音"><svg class="ic"><use href="#i-sound"/></svg></button>
          <button id="btnHelp" class="mini" title="怎么玩"><svg class="ic"><use href="#i-help"/></svg></button>
        </div>
      </div>
      <div id="program"></div>
    </div>

    <div id="palette">
      <button class="pal" data-block="hop"><svg class="ic"><use href="#i-hop"/></svg><span class="nm">跳</span></button>
      <button class="pal" data-block="chirp"><svg class="ic"><use href="#i-chirp"/></svg><span class="nm">叫</span></button>
      <button class="pal" data-block="eat"><svg class="ic"><use href="#i-eat"/></svg><span class="nm">吃</span></button>
      <button class="pal" data-block="left"><svg class="ic"><use href="#i-left"/></svg><span class="nm">左转</span></button>
      <button class="pal" data-block="right"><svg class="ic"><use href="#i-right"/></svg><span class="nm">右转</span></button>
      <button class="pal" data-block="spin"><svg class="ic"><use href="#i-spin"/></svg><span class="nm">转身</span></button>
      <button class="pal" data-block="if"><svg class="ic"><use href="#i-if"/></svg><span class="nm">如果</span></button>
      <button class="pal" data-block="repeat"><svg class="ic"><use href="#i-repeat"/></svg><span class="nm">重复</span></button>
    </div>
    <div class="playControls">
      <button id="btnRun" class="pal run"><svg class="ic"><use href="#i-run"/></svg><span class="nm">运行</span></button>
      <button id="btnStep" class="pal step"><svg class="ic"><use href="#i-step"/></svg><span class="nm">单步</span></button>
    </div>

    <div id="picker" class="hidden">
      <div id="pickerTitle"></div>
      <div id="pickerItems"></div>
      <button id="pickerCancel">取消</button>
    </div>
  </section>
</div>

<script src="game.js"></script>
<script>if("serviceWorker" in navigator){let controlled=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(controlled)location.reload();else controlled=true;});navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
</html>
