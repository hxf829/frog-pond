<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>青蛙池塘 · Frog Pond</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#0d1b1e">
</head>
<body>

<!-- ===== icon sprite ===== -->
<svg id="sprite" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <symbol id="i-frog" viewBox="0 0 48 48">
    <ellipse cx="24" cy="31" rx="18" ry="14" fill="#4cc45a"/>
    <circle cx="15" cy="15" r="8" fill="#4cc45a"/><circle cx="33" cy="15" r="8" fill="#4cc45a"/>
    <circle cx="15" cy="15" r="4.2" fill="#fff"/><circle cx="33" cy="15" r="4.2" fill="#fff"/>
    <circle cx="16" cy="16" r="2.1" fill="#12181a"/><circle cx="34" cy="16" r="2.1" fill="#12181a"/>
    <path d="M16 31a8 8 0 0 0 16 0" stroke="#2f8f3d" stroke-width="3" fill="none" stroke-linecap="round"/>
  </symbol>

  <!-- 前进：一个大箭头指向前面的荷叶 -->
  <symbol id="i-move" viewBox="0 0 48 48">
    <ellipse cx="24" cy="42" rx="16" ry="4.8" fill="#4cc45a"/>
    <path d="M24 33V11" stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M11 24 24 9l13 15Z" fill="currentColor"/>
  </symbol>

  <!-- 跳跃：两只荷叶之间，一只青蛙腾空 -->
  <symbol id="i-jump" viewBox="0 0 48 48">
    <ellipse cx="9" cy="41" rx="9" ry="3.6" fill="#4cc45a"/>
    <ellipse cx="39" cy="41" rx="9" ry="3.6" fill="#4cc45a"/>
    <path d="M9 35C9 16 39 16 39 35" fill="none" stroke="currentColor" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="4 5" opacity=".65"/>
    <g fill="currentColor">
      <ellipse cx="24" cy="20" rx="9" ry="6.5"/>
      <circle cx="18" cy="11" r="4.4"/><circle cx="30" cy="11" r="4.4"/>
      <circle cx="18" cy="10.6" r="1.9" fill="#0d1b1e"/><circle cx="30" cy="10.6" r="1.9" fill="#0d1b1e"/>
      <path d="M16 27c-3 2-4 5-3 7M32 27c3 2 4 5 3 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    </g>
  </symbol>

  <!-- 左转：先向上再向左的直角箭头 -->
  <symbol id="i-left" viewBox="0 0 48 48" fill="none">
    <path d="M30 45V24a6 6 0 0 0-6-6H8" stroke="currentColor" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1 18 17 6v24Z" fill="currentColor"/>
  </symbol>

  <!-- 右转：先向上再向右的直角箭头 -->
  <symbol id="i-right" viewBox="0 0 48 48" fill="none">
    <path d="M18 45V24a6 6 0 0 1 6-6h16" stroke="currentColor" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 18 31 6v24Z" fill="currentColor"/>
  </symbol>

  <!-- 换色：四色转盘 -->
  <symbol id="i-color" viewBox="0 0 48 48">
    <path d="M24 24V4a20 20 0 0 1 20 20Z" fill="#ff6b5a"/>
    <path d="M24 24h20a20 20 0 0 1-20 20Z" fill="#ffd166"/>
    <path d="M24 24v20a20 20 0 0 1-20-20Z" fill="#4cc45a"/>
    <path d="M24 24H4a20 20 0 0 1 20-20Z" fill="#4fb8e8"/>
    <circle cx="24" cy="24" r="7" fill="#0d1b1e"/>
  </symbol>

  <!-- 唱歌：音符 -->
  <symbol id="i-sing" viewBox="0 0 48 48" fill="none">
    <path d="M18 13v22" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M36 9v22" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M18 13 36 9" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="13" cy="37" rx="7.4" ry="5.6" fill="currentColor" transform="rotate(-18 13 37)"/>
    <ellipse cx="31" cy="33" rx="7.4" ry="5.6" fill="currentColor" transform="rotate(-18 31 33)"/>
  </symbol>

  <!-- 运行：三角 -->
  <symbol id="i-run" viewBox="0 0 48 48">
    <path d="M14 7 42 24 14 41Z" fill="currentColor"/>
  </symbol>

  <!-- 单步：三角 + 竖线 -->
  <symbol id="i-step" viewBox="0 0 48 48">
    <path d="M10 9 33 24 10 39Z" fill="currentColor"/>
    <rect x="37" y="9" width="6" height="30" rx="2" fill="currentColor"/>
  </symbol>

  <!-- 撤销：向左的回头箭头 -->
  <symbol id="i-undo" viewBox="0 0 48 48" fill="none">
    <path d="M13 17h16a10 10 0 0 1 0 20h-6" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M3 17 15 7v20Z" fill="currentColor"/>
  </symbol>

  <!-- 清空：垃圾桶 -->
  <symbol id="i-trash" viewBox="0 0 48 48" fill="none">
    <path d="M11 15h26" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M18 15v-3a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v3" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M15 15l2.2 25a4 4 0 0 0 4 3.6h5.6a4 4 0 0 0 4-3.6L33 15" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 重置：环形箭头 -->
  <symbol id="i-reset" viewBox="0 0 48 48" fill="none">
    <path d="M9 24a15 15 0 0 1 30 0" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M31 18h14l-7 10Z" fill="currentColor"/>
  </symbol>

  <!-- 喇叭 -->
  <symbol id="i-sound" viewBox="0 0 48 48" fill="none">
    <path d="M9 18h8l10-9v30L17 30H9Z" fill="currentColor"/>
    <path d="M32 18a9 9 0 0 1 0 12" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M38 13a16 16 0 0 1 0 22" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
  </symbol>

  <!-- 静音 -->
  <symbol id="i-mute" viewBox="0 0 48 48" fill="none">
    <path d="M9 18h8l10-9v30L17 30H9Z" fill="currentColor"/>
    <path d="M32 17 42 29M42 17 32 29" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
  </symbol>

  <!-- 甲虫 -->
  <symbol id="i-bug" viewBox="0 0 48 48">
    <circle cx="24" cy="28" r="13" fill="#e23b2c"/>
    <path d="M24 15v26" stroke="#141414" stroke-width="3.5"/>
    <circle cx="16.5" cy="24" r="2.5" fill="#141414"/><circle cx="31.5" cy="24" r="2.5" fill="#141414"/>
    <circle cx="16.5" cy="33" r="2.5" fill="#141414"/><circle cx="31.5" cy="33" r="2.5" fill="#141414"/>
    <path d="M16 15a9 9 0 0 1 16 0Z" fill="#141414"/>
    <path d="M18 8 14 3M30 8l4-5" stroke="#141414" stroke-width="2.6" stroke-linecap="round"/>
  </symbol>

  <!-- 指令：积木堆 -->
  <symbol id="i-blocks" viewBox="0 0 48 48">
    <rect x="6" y="7" width="15" height="15" rx="4" fill="currentColor" opacity=".55"/>
    <rect x="27" y="7" width="15" height="15" rx="4" fill="currentColor"/>
    <rect x="16" y="27" width="15" height="15" rx="4" fill="currentColor" opacity=".78"/>
  </symbol>

  <!-- 关卡：星星 -->
  <symbol id="i-star" viewBox="0 0 48 48">
    <path d="m24 5 6 12.4 13.7 2-9.9 9.6 2.3 13.6L24 36l-12.1 6.6 2.3-13.6-9.9-9.6 13.7-2Z" fill="currentColor"/>
  </symbol>

  <!-- 奖杯 -->
  <symbol id="i-trophy" viewBox="0 0 48 48" fill="none">
    <path d="M15 7h18v9a9 9 0 0 1-18 0Z" fill="currentColor"/>
    <path d="M15 10H9a6 6 0 0 0 6 8M33 10h6a6 6 0 0 1-6 8" stroke="currentColor" stroke-width="4"/>
    <path d="M24 25v8" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M14 42h20M17 33h14l2 9H15Z" fill="currentColor"/>
  </symbol>

  <!-- 如果：菱形分叉（上下两条路，中间一个判断点） -->
  <symbol id="i-if" viewBox="0 0 48 48" fill="none">
    <path d="M24 4 44 20 24 36 4 20Z" fill="currentColor" opacity=".28"/>
    <path d="M24 4 44 20 24 36 4 20Z" stroke="currentColor" stroke-width="4"
          stroke-linejoin="round"/>
    <path d="M24 12v9" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <circle cx="24" cy="27" r="3.2" fill="currentColor"/>
  </symbol>

  <!-- 重复：环形回路箭头 -->
  <symbol id="i-repeat" viewBox="0 0 48 48" fill="none">
    <path d="M38 24a14 14 0 1 1-5.2-10.9" stroke="currentColor" stroke-width="6"
          stroke-linecap="round"/>
    <path d="M33 5v10H23Z" fill="currentColor"/>
  </symbol>

  <!-- 数字卡：带孔的插销卡片 -->
  <symbol id="i-number" viewBox="0 0 48 48" fill="none">
    <rect x="9" y="11" width="30" height="26" rx="6" fill="currentColor" opacity=".22"/>
    <rect x="9" y="11" width="30" height="26" rx="6" stroke="currentColor" stroke-width="4"/>
    <circle cx="24" cy="24" r="6.5" fill="currentColor"/>
    <path d="M21 20.5h6M24 18v13" stroke="#0d1b1e" stroke-width="2.6" stroke-linecap="round"/>
  </symbol>

  <!-- 条件：前面有甲虫 -->
  <symbol id="i-cond-bug" viewBox="0 0 48 48">
    <circle cx="15" cy="30" r="9" fill="currentColor"/>
    <path d="M15 21v18" stroke="#0d1b1e" stroke-width="2.6"/>
    <circle cx="11" cy="27" r="1.9" fill="#0d1b1e"/><circle cx="19" cy="27" r="1.9" fill="#0d1b1e"/>
    <circle cx="11" cy="33" r="1.9" fill="#0d1b1e"/><circle cx="19" cy="33" r="1.9" fill="#0d1b1e"/>
    <path d="M9 21a6 6 0 0 1 12 0Z" fill="#0d1b1e"/>
    <path d="M33 12v24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <path d="M27 30 33 38l6-8Z" fill="currentColor"/>
  </symbol>

  <!-- 条件：前面是水面缺口 -->
  <symbol id="i-cond-gap" viewBox="0 0 48 48">
    <ellipse cx="15" cy="30" rx="10" ry="7" fill="currentColor" opacity=".2"/>
    <ellipse cx="15" cy="30" rx="10" ry="7" stroke="currentColor" stroke-width="3.4"/>
    <ellipse cx="15" cy="30" rx="4" ry="2.6" fill="currentColor"/>
    <path d="M33 12v24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <path d="M27 30 33 38l6-8Z" fill="currentColor"/>
  </symbol>

  <!-- 条件：前面到边了 -->
  <symbol id="i-cond-edge" viewBox="0 0 48 48">
    <path d="M8 40V14" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M8 8 4 15h8Z" fill="currentColor"/>
    <path d="M16 40h24" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M24 30v-6" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <circle cx="24" cy="19" r="3.2" fill="currentColor"/>
  </symbol>

  <!-- 条件：池塘有甲虫（任意位置） -->
  <symbol id="i-cond-any" viewBox="0 0 48 48">
    <circle cx="24" cy="28" r="11" fill="currentColor"/>
    <path d="M24 17v22" stroke="#0d1b1e" stroke-width="2.8"/>
    <circle cx="19" cy="24" r="2" fill="#0d1b1e"/><circle cx="29" cy="24" r="2" fill="#0d1b1e"/>
    <circle cx="19" cy="31" r="2" fill="#0d1b1e"/><circle cx="29" cy="31" r="2" fill="#0d1b1e"/>
    <path d="M17 17a7 7 0 0 1 14 0Z" fill="#0d1b1e"/>
  </symbol>

  <!-- 条件：前面没虫（空的荷叶） -->
  <symbol id="i-cond-free" viewBox="0 0 48 48">
    <ellipse cx="15" cy="30" rx="10" ry="7" fill="currentColor" opacity=".2"/>
    <ellipse cx="15" cy="30" rx="10" ry="7" stroke="currentColor" stroke-width="3.4"/>
    <path d="M15 24v7" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M33 12v24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <path d="M27 30 33 38l6-8Z" fill="currentColor"/>
  </symbol>

  <!-- 条件：前面是水（没有睡莲可以落脚） -->
  <symbol id="i-cond-water" viewBox="0 0 48 48">
    <path d="M6 22c3-3 5-3 8 0s5 3 8 0 5-3 8 0 5 3 8 0" stroke="currentColor"
          stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M6 32c3-3 5-3 8 0s5 3 8 0 5-3 8 0 5 3 8 0" stroke="currentColor"
          stroke-width="3.4" fill="none" stroke-linecap="round" opacity=".65"/>
    <path d="M33 8v22" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <path d="M27 24 33 32l6-8Z" fill="currentColor"/>
  </symbol>

  <!-- 插销：塞进下一张卡片的凸起 -->
  <symbol id="i-plug" viewBox="0 0 48 48">
    <path d="M14 26h20v-9a5 5 0 0 0-10 0v3H14Z" fill="currentColor"/>
    <path d="M12 26h24v10H12Z" fill="currentColor" opacity=".45"/>
  </symbol>

  <!-- 手指：提示点击 -->
  <symbol id="i-tap" viewBox="0 0 48 48" fill="none">
    <path d="M22 30V13a4 4 0 0 1 8 0v13" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M30 26v-4a4 4 0 0 1 8 0v6" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M22 15v-2a4 4 0 0 1 8 0" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M14 20a4 4 0 0 1 8 0v10c0 8-3 12-8 12s-8-4-8-12v-4a4 4 0 0 1 8 0" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 12l4 4-4 4" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
  </symbol>
</svg>

<div id="app">
  <header id="topbar">
    <div class="title">
      <svg class="ic logo"><use href="#i-frog"/></svg>
      <div>
        <h1>青蛙池塘</h1>
        <p>Frog Pond</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat" title="剩余甲虫"><svg class="ic"><use href="#i-bug"/></svg><b id="statBeetles">0</b></div>
      <div class="stat" title="指令数"><svg class="ic"><use href="#i-blocks"/></svg><b id="statMoves">0</b></div>
      <div class="stat" title="关卡"><svg class="ic"><use href="#i-star"/></svg><b id="statLevel">1</b></div>
    </div>
  </header>

  <main id="stage">
    <canvas id="pond"></canvas>
    <div id="toast"></div>
    <div id="overlay" class="hidden">
      <div class="card">
        <svg class="ic big" id="ovIcon"><use href="#i-trophy"/></svg>
        <h2 id="ovTitle">完成！</h2>
        <p id="ovBody"></p>
        <button id="ovBtn">继续</button>
      </div>
    </div>
  </main>

  <section id="panel">
    <div id="progWrap">
      <div id="progHead">
        <svg class="ic sm"><use href="#i-blocks"/></svg>
        <span id="progCount">0</span>
        <div class="headBtns">
          <button id="btnUndo" class="mini" title="撤销"><svg class="ic"><use href="#i-undo"/></svg></button>
          <button id="btnClear" class="mini" title="清空"><svg class="ic"><use href="#i-trash"/></svg></button>
          <button id="btnReset" class="mini" title="重置"><svg class="ic"><use href="#i-reset"/></svg></button>
          <button id="btnSound" class="mini" title="声音"><svg class="ic"><use href="#i-sound"/></svg></button>
        </div>
      </div>
      <div id="program">
        <div id="progEmpty">
          <svg class="ic sm"><use href="#i-tap"/></svg>
          <span>点下面的积木排成一排</span>
          <svg class="ic sm"><use href="#i-run"/></svg>
          <span>再按这个跑</span>
        </div>
      </div>
    </div>

    <div id="palette">
      <button class="pal" data-block="move"><svg class="ic"><use href="#i-move"/></svg><span class="nm">前进</span></button>
      <button class="pal" data-block="jump"><svg class="ic"><use href="#i-jump"/></svg><span class="nm">跳跃</span></button>
      <button class="pal" data-block="left"><svg class="ic"><use href="#i-left"/></svg><span class="nm">左转</span></button>
      <button class="pal" data-block="right"><svg class="ic"><use href="#i-right"/></svg><span class="nm">右转</span></button>
      <button class="pal" data-block="color"><svg class="ic"><use href="#i-color"/></svg><span class="nm">换色</span></button>
      <button class="pal" data-block="sing"><svg class="ic"><use href="#i-sing"/></svg><span class="nm">唱歌</span></button>
      <button class="pal" data-block="if"><svg class="ic"><use href="#i-if"/></svg><span class="nm">如果</span></button>
      <button class="pal" data-block="repeat"><svg class="ic"><use href="#i-repeat"/></svg><span class="nm">重复</span></button>
      <button id="btnRun" class="pal run"><svg class="ic"><use href="#i-run"/></svg><span class="nm">运行</span></button>
      <button id="btnStep" class="pal step"><svg class="ic"><use href="#i-step"/></svg><span class="nm">单步</span></button>
    </div>

    <!-- 选条件 / 选数字：点积木时弹出来 -->
    <div id="picker" class="hidden">
      <div id="pickerTitle"></div>
      <div id="pickerItems"></div>
      <button id="pickerCancel">取消</button>
    </div>
  </section>
</div>
<script src="game.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
</body>
</html>
